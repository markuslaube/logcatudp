name: Build Signed APK

on:
  push:
    branches:
      - android8-fix
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          validate-wrappers: false

      - name: Regenerate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.14.3

      - name: Decode signing keystore
        run: |
          echo "${{ secrets.LOGCATUDP_KEYSTORE }}" | base64 -d > app/logcatudp.keystore

      - name: Build signed APK
        env:
          SIGNING_KEYSTORE: app/logcatudp.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.LOGCATUDP_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.LOGCATUDP_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.LOGCATUDP_KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleDebug -x lint

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/bi.lau.android.logcatudp_1.${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bi.lau.android.logcatudp_1.${{ github.run_number }}.apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
